name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web assets into Android
        run: npm run android:sync

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode release keystore
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flow-release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/flow-release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: github.ref_type != 'tag'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Name release APK
        if: github.ref_type == 'tag'
        run: cp android/app/build/outputs/apk/release/app-release.apk "flow-${GITHUB_REF_NAME}.apk"

      - name: Name debug APK
        if: github.ref_type != 'tag'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "flow-${GITHUB_REF_NAME}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow-${{ github.ref_name }}
          path: flow-*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: flow-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            **flow** Android APK，基于 `${{ github.sha }}` 构建。

            - release 签名，可直接安装
            - 数据仅保存在 APK 内，与浏览器 PWA 相互独立
            - 不是 Play Store 构建
